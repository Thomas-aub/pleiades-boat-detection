# =============================================================================
# configs/preprocessing_2.yaml
# =============================================================================
# Configuration for the SAHI-optimised Global Preprocessing Pipeline — v2.
#
# Key change from preprocessing.yaml (v1)
# ----------------------------------------
# OLD pipeline (v1):
#   Stage 1 radiometric → Stage 2 spatial → Stage 3 annotations
#   → Stage 4 split (image-level train/val/test)
#   → Stage 5 tiling (overlapping patches per split)
#
# NEW pipeline (v2):
#   Stage 1 radiometric → Stage 2 spatial → Stage 3 annotations
#   → Stage 6 tiled_split  (tile FIRST with NO overlap, THEN split/shard)
#
# What Stage 6 produces
# ----------------------
#   data/<number>/
#     train/
#       1/  images/*.tif   labels/*.txt   (1/8 of all train tiles)
#       2/  …
#       …
#       8/  images/*.tif   labels/*.txt
#     val/
#       images/*.tif
#       labels/*.txt
#     metadata.csv    ← per-folder: source-image %, class counts, tile count
#
# Tile distribution guarantees
# -----------------------------
#  • Every source image contributes tiles to BOTH val and train.
#  • Every train shard receives tiles from EVERY source image (round-robin).
#  • All split/shard assignments are reproducible (fixed random_seed).
#
# Pipeline stages (set enabled: false to skip any stage)
# -------------------------------------------------------
#   1  radiometric  - percentile stretch + gamma on the full GeoTIFF
#   2  spatial      - Upsampling via windowed rasterio I/O
#   3  annotations  - GeoJSON OBB → YOLO OBB (global normalisation)
#   6  tiled_split  - non-overlapping tiling + 80/20 split + 8-shard train
# =============================================================================

# ---------------------------------------------------------------------------
# I/O paths  (relative to project root, or absolute)
# ---------------------------------------------------------------------------
paths:
  raw_dir:           "data/raw50"                    # source GeoTIFFs + GeoJSONs
  processed_dir:     "data/number/processed"              # root for all processed artefacts
  radiometric_dir:   "data/number/processed/radiometric"  # stage 1 output
  spatial_dir:       "data/number/processed/spatial"      # stage 2 output
  labels_dir:        "data/number/processed/labels"       # stage 3 output (pre-split .txt)
  tiled_split_dir:   "data/number/tiled"                           # stage 6 output root

# ---------------------------------------------------------------------------
# Stage registry — controls which stages run and in what order.
# Set enabled: false (or remove the entry) to skip a stage.
# ---------------------------------------------------------------------------
stages:
  - id: 1
    name: radiometric
    enabled: true
  - id: 2
    name: spatial
    enabled: true
  - id: 3
    name: annotations
    enabled: true
  - id: 6
    name: tiled_split
    enabled: true

# ---------------------------------------------------------------------------
# Stage 1 - Radiometric normalisation  (unchanged from v1)
# ---------------------------------------------------------------------------
radiometric:
  lo_percentile: 1.0
  hi_percentile: 99.9
  gamma: 0.8
  bands: null
  compress: "lzw"

# ---------------------------------------------------------------------------
# Stage 2 - Spatial upsampling  (unchanged from v1)
# ---------------------------------------------------------------------------
spatial:
  upscale_ratio: 2
  interpolation: "cubic"
  window_size: 1536
  compress: "lzw"

# ---------------------------------------------------------------------------
# Stage 3 - Annotation conversion  (unchanged from v1)
# ---------------------------------------------------------------------------
annotations:
  min_visible: 0.10
  min_size_px: 2.0
  class_map:
    0: 0   # Pirogue
    1: 0   # Double_hulled_Pirogue
    2: 1   # Small_Motorboat
    3: 2   # Medium_Motorboat  (merged into Large_Motorboat)
    4: 2   # Large_Motorboat
    5: 2   # Sailing_Boat      (merged into Large_Motorboat)
    6: 2   #                   (merged into Large_Motorboat)
    8: 0   #                   (merged into Pirogue)
    10: 0  #                   (merged into Pirogue)
  skip_classes: [9, 11]

# ---------------------------------------------------------------------------
# Stage 6 - Tile-first split with train sharding
#   (src/vessels_detect/preprocessing/steps/tiled_split.py)
#
# Workflow inside this stage:
#   1. Tile every GeoTIFF in spatial_dir into non-overlapping tile_size×tile_size
#      patches (raw pixel values preserved, no radiometric processing).
#   2. For each source image, shuffle its tiles and assign val_ratio of them
#      to val; the rest go to train.  This ensures proportional representation
#      of every source image in both sets.
#   3. Distribute all train tiles across n_train_shards numbered sub-folders
#      using per-source round-robin assignment so each shard is a balanced mix.
#   4. Write metadata.csv to tiled_split_dir with per-folder statistics.
# ---------------------------------------------------------------------------
tiled_split:
  # Output tile height and width in pixels.
  # Edge tiles are padded with nodata (or 0) to this exact size.
  # No overlap is applied — stride = tile_size.
  tile_size: 2048

  # GeoTIFF compression for the output tile files.
  compress: "lzw"

  # Minimum fraction of an OBB's area that must fall inside a tile for the
  # corresponding YOLO label line to be written.
  # 0.00 → keep every annotation that touches the tile.
  # 0.10 → discard annotations that are less than 10 % visible.
  min_visible_frac: 0.10

  # Fraction of each source image's tiles assigned to the validation set.
  # Remaining (1 - val_ratio) tiles go to the train set.
  val_ratio: 0.20

  # Number of numbered sub-folders inside train/ (train/1 … train/8).
  # Each shard receives 1/n_train_shards of all train tiles, with tiles
  # from every source image distributed evenly across shards.
  n_train_shards: 8

  # Fixed seed for reproducible shuffling and shard assignment.
  random_seed: 42

  # If true, tiles are copied to the destination directories (originals kept
  # in the staging area until cleanup).  If false, tiles are moved.
  copy: true