# =============================================================================
# configs/preprocessing.yaml
# =============================================================================
# Configuration for the vessel-detection preprocessing pipeline.
#
# Pipeline stages (run in this order, see scripts/preprocessing.py)
# -------------------------------------------------------------------
#   0  degradation          - anti-alias blur + GSD downsampling
#   1  image_enhancement    - percentile stretch + gamma, then upsampling
#   2  label_conversion     - GeoJSON OBB -> YOLO OBB (normalised to full image)
#   3  dataset_split        - image-level train / val / test split
#   4  slicing              - tiling of each split image + label projection
#   5  background_filtering - cap background-tile ratio per split
#   6  data_augmentation    - synthesize extra augmented tiles (final step)
# =============================================================================

# ---------------------------------------------------------------------------
# I/O paths (relative to project root, or absolute)
# ---------------------------------------------------------------------------
paths:
  raw_dir: "data/raw"                     # source GeoTIFFs + GeoJSONs
  degraded_dir: "data/processed/degraded" # output of degradation
  enhanced_dir: "data/processed/enhanced" # output of image_enhancement
  labels_dir: "data/processed/labels"     # output of label_conversion (pre-split)
  dataset_dir: "data/dataset"             # output of dataset_split {train,val,test}/
  tiled_dir: "data/dataset/tiled"         # output of slicing {train,val,test}/

# ---------------------------------------------------------------------------
# Pipeline-level settings
# ---------------------------------------------------------------------------
pipeline:
  # Peak RAM one worker needs while processing a single GeoTIFF (reading the
  # source + writing the 2x upsampled output). Used to cap the process pool
  # so it never allocates more than the available system RAM.
  # Rule of thumb: ~3x the largest raw .tif file size on disk, in GB.
  # Lower this if you see OOM kills; raise it to allow more parallelism.
  ram_per_worker_gb: 4.0

# ---------------------------------------------------------------------------
# Stage 0 - GSD degradation (anti-alias blur + downsampling)
# ---------------------------------------------------------------------------
# Brings raw imagery down from its native GSD to the target sensor's GSD
# (e.g. Pléiades Neo 0.3 m/px -> Pléiades 0.5 m/px) so the rest of the
# pipeline always sees a consistent resolution domain. Set enabled: false
# to skip this stage entirely (the source file is copied through as-is).
degradation:
  enabled: false

  source_gsd_m: 0.3        # native ground sample distance of the raw imagery
  target_gsd_m: 0.5        # desired output GSD

  # Gaussian blur sigma = blur_factor * (target_gsd / source_gsd).
  # Suppresses high-frequency content before decimation to avoid aliasing.
  blur_factor: 0.45

  compress: "deflate"

# ---------------------------------------------------------------------------
# Stage 1a - Radiometric normalisation (percentile stretch + gamma)
# ---------------------------------------------------------------------------
radiometric:
  lo_percentile: 0      # pixel values below this percentile are clamped
  hi_percentile: 100     # pixel values above this percentile are clamped
  gamma: 0.8               # < 1.0 brightens shadows (recommended for boats)
  bands: null              # 1-based RGB band indices; null = auto-detect
  compress: "lzw"

# ---------------------------------------------------------------------------
# Stage 1b - Spatial upsampling
# ---------------------------------------------------------------------------
spatial:
  upscale_ratio: 2
  interpolation: "cubic"   # lanczos | cubic | bilinear | nearest
  window_size: 1536        # internal tile size for windowed rasterio I/O
  compress: "lzw"

# ---------------------------------------------------------------------------
# Stage 2 - Annotation conversion (GeoJSON OBB -> YOLO OBB)
# ---------------------------------------------------------------------------
annotations:
  min_visible: 0.10        # min fraction of OBB area inside the image
  min_size_px: 2.0         # minimum OBB side length, in pixels

  # Maps every source class to a single "Bateau" (boat) class.
  class_map:
    0: 0
    1: 0
    2: 1
    3: 0
    4: 1
    5: 1
    6: 1
    10: 1

  skip_classes: [8, 9, 11]    # classes discarded entirely

# ---------------------------------------------------------------------------
# Stage 3 - Image-level train / val / test split
# ---------------------------------------------------------------------------
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

  priority_class_ids: [0]  # classes balanced more aggressively across splits
  priority_weight: 5.0

  random_seed: 42
  copy: true                # true = copy files, false = move them

# ---------------------------------------------------------------------------
# Stage 4 - Tiling (slicing) + label projection
# ---------------------------------------------------------------------------
tiling:
  splits: [train, val]

  tile_size: 1536           # output tile width/height in pixels
  overlap: 0                # pixel overlap between adjacent tiles
  compress: "lzw"

  min_visible_frac: 0.10    # min fraction of OBB area inside the tile

  images_subdir: "images"
  labels_subdir: "labels"

# ---------------------------------------------------------------------------
# Stage 5 - Background tile reduction
# ---------------------------------------------------------------------------
background_reduction:
  splits: [train]

  target_bg_ratio: 0.15     # max fraction of background tiles to keep
  random_seed: 42

  images_subdir: "images"   # must match tiling.images_subdir
  labels_subdir: "labels"   # must match tiling.labels_subdir
  moved_subdir: "moved"     # excess background tiles are relocated here

# ---------------------------------------------------------------------------
# Stage 6 - Data augmentation (final step)
# ---------------------------------------------------------------------------
# Generates extra photometrically-augmented copies of every tile in the
# configured split(s). Runs last so it only augments the final,
# background-filtered tile set. Augmentations are pixel-only, so labels
# are copied through unchanged for every augmented copy.
data_augmentation:
  enabled: true

  splits: [train]            # usually only train; val/test stay untouched
  n_augmentations: 2          # number of augmented copies generated per tile

  images_subdir: "images"     # must match tiling.images_subdir
  labels_subdir: "labels"     # must match tiling.labels_subdir

  # Albumentations transforms, applied in this order.
  # Each entry maps an Albumentations class name to its constructor kwargs.
  transforms:
    - name: GaussNoise
      p: 1.0
      std_range: [0.0, 0.04]
    # - name: RandomBrightnessContrast
    #   p: 0.5
    #   brightness_limit: 0.1
    #   contrast_limit: 0.1